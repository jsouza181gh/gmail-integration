name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]  # main runs this through deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gmail
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gmail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gmail -d gmail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: mypy
        run: python -m mypy
      - name: migrations on Postgres (up, down, up)
        env:
          DATABASE_URL: postgresql+psycopg://gmail:ci@localhost:5432/gmail
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: pytest on Postgres (queue locking, pgvector)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gmail:ci@localhost:5432/gmail
        run: python -m pytest -q tests/test_jobs_pg.py tests/test_vector_pg.py
