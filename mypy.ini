[mypy]
plugins = pydantic.mypy
strict = True
disallow_any_explicit = True
files = src/llm, src/utils/console.py, src/db/models.py, tests/test_llm_gateway.py, tests/test_llm_recorder.py, tests/test_migrations.py

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-googleapiclient.*]
ignore_missing_imports = True
