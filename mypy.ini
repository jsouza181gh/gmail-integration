[mypy]
plugins = pydantic.mypy
strict = True
disallow_any_explicit = True
# google-auth ships no annotations; calls into it are the only untyped ones
untyped_calls_exclude = google
files = src/llm, src/utils/console.py, src/db, src/gmail/messages.py, src/classification, src/cli/classify_unread.py, src/cli/main.py, tests/test_llm_gateway.py, tests/test_llm_recorder.py, tests/test_migrations.py, tests/test_taxonomy_store.py, tests/test_classifier.py, tests/test_messages.py, src/cli/reclassify.py, tests/test_reclassify.py, src/services/sync.py, src/api/app.py, src/api/log_filters.py, src/gmail/watch.py, tests/test_deploy_script.py

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-googleapiclient.*]
ignore_missing_imports = True
