[mypy]
plugins = pydantic.mypy
strict = True
disallow_any_explicit = True
# google-auth ships no annotations; calls into it are the only untyped ones
untyped_calls_exclude = google
files = src/llm, src/utils/console.py, src/db, src/gmail/messages.py, src/classification, src/cli/classify_unread.py, src/cli/main.py, tests/test_llm_gateway.py, tests/test_llm_recorder.py, tests/test_migrations.py, tests/test_taxonomy_store.py, tests/test_classifier.py, tests/test_messages.py, src/cli/reclassify.py, tests/test_reclassify.py, src/services/sync.py, src/api/app.py, src/api/log_filters.py, src/gmail/watch.py, tests/test_deploy_script.py, src/jobs, src/worker.py, tests/test_jobs.py, tests/test_jobs_pg.py, src/agent/types.py, src/agent/ports.py, src/agent/context.py, src/agent/state.py, src/agent/registry.py, src/agent/trail.py, src/agent/executor.py, src/agent/loop.py, tests/agent_fakes.py, tests/test_agent_runtime.py, src/agent/tools, src/agent/sender_history.py, src/gmail/reader.py, tests/test_agent_tools.py, tests/test_gmail_reader.py, tests/fakes.py, src/agent/policy.py, src/agent/actions.py, src/agent/rules.py, tests/test_policy_actions.py, tests/test_rules.py

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-googleapiclient.*]
ignore_missing_imports = True
