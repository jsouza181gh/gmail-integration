[mypy]
plugins = pydantic.mypy
strict = True
disallow_any_explicit = True
# google-auth ships no annotations; calls into it are the only untyped ones
untyped_calls_exclude = google
files = src/llm, src/auth, tests/test_auth_config.py, src/api/deps.py, src/api/security.py, src/api/routes, src/cli/create_user.py, src/cli/unlock.py, tests/test_vector_pg.py, src/utils/console.py, src/db, src/gmail/messages.py, src/classification, src/cli/classify_unread.py, src/cli/main.py, tests/test_llm_gateway.py, tests/test_llm_recorder.py, tests/test_migrations.py, tests/test_taxonomy_store.py, tests/test_classifier.py, tests/test_messages.py, src/cli/reclassify.py, tests/test_reclassify.py, src/services/sync.py, src/api/app.py, src/api/log_filters.py, src/gmail/watch.py, tests/test_deploy_script.py, src/jobs, src/cli/jobs.py, src/cli/backfill.py, src/cli/docs.py, tests/test_cli_docs.py, tests/test_backfill.py, src/worker.py, tests/test_jobs.py, tests/test_jobs_pg.py, src/agent/types.py, src/agent/ports.py, src/agent/context.py, src/agent/state.py, src/agent/registry.py, src/agent/trail.py, src/agent/executor.py, src/agent/loop.py, tests/agent_fakes.py, tests/test_agent_runtime.py, src/agent/tools, src/agent/sender_history.py, src/gmail/reader.py, src/gmail/full.py, src/indexing, tests/test_gmail_full.py, tests/test_indexer.py, tests/test_documents.py, tests/gmail_samples.py, tests/test_agent_tools.py, tests/test_gmail_reader.py, tests/fakes.py, src/agent/policy.py, src/agent/actions.py, src/agent/rules.py, tests/test_policy_actions.py, tests/test_rules.py, src/agent/config.py, src/agent/kb.py, src/agent/prompts.py, src/agent/flows, src/agent/wiring.py, src/gmail/labels.py, src/cli/enqueue.py, tests/test_process_email.py, tests/test_gmail_labels.py, src/agent/approvals.py, src/gmail/actions.py, src/gmail/client.py, src/cli/actions.py, src/cli/rules.py, tests/test_gmail_actions.py, tests/test_execute_action.py, tests/test_cli_actions.py, src/alerts, tests/test_alerts.py

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True
