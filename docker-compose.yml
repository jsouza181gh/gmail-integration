x-app: &app
  # CI publishes one tag per commit; deploy/deploy.sh sets APP_TAG.
  # `docker compose build` still builds locally under the same name.
  image: ghcr.io/jsouza181gh/gmail-integration:${APP_TAG:-latest}
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://gmail:${POSTGRES_PASSWORD}@db:5432/gmail
    GMAIL_TOKEN_PATH: /app/secrets/token.json

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gmail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmail -d gmail"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    # mesmo UID/GID do dono de ./secrets no host (ex.: `id -u` na VPS)
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "src.worker"]
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    # finishes the job in flight on SIGTERM
    stop_grace_period: 120s
    healthcheck:
      # the loop touches the heartbeat between jobs; a long LLM job with
      # retries can take minutes, hence the generous window
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 900)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
